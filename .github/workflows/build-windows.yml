name: Build ORBIT REVERB (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run offline tests
        run: build\OrbitTests_artefacts\Release\OrbitTests.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-REVERB-VST3-Windows
          path: build/OrbitReverb_artefacts/Release/VST3/
